name: Generate Serum 2 Presets

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_presets.py"
      - ".github/workflows/generate-presets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install cbor2 zstandard

      - name: Generate collection
        run: python scripts/generate_presets.py

      - name: Commit generated presets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Presets" "manifest.json" "Neon_Forms_100_Serum2.zip"
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate Neon Forms 100 Serum 2 presets"
          git push
